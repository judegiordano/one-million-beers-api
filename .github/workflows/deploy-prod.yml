name: Deploy Prod

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: use pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - name: get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: use Rust
        uses: dtolnay/rust-toolchain@stable

      - name: use Rust cache
        uses: Swatinem/rust-cache@v2

      - name: use Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: use rustup target
        run: rustup target add aarch64-unknown-linux-gnu

      - name: use Cargo Lambda
        uses: jaxxstorm/action-install-gh-release@v1.9.0
        with:
          repo: cargo-lambda/cargo-lambda
          platform: linux
          arch: x86_64

      - name: build lambdas
        run: |
          set -euxo pipefail
          cargo lambda build --release --arm64 --bin api
          pwd
          ls -la target/lambda/api
          cargo metadata --format-version 1 --no-deps | jq -r .target_directory

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: sst install providers
        run: |
          set -euxo pipefail
          pnpm sst install

      - name: sst deploy
        timeout-minutes: 30
        run: |
          set -euxo pipefail
          pnpm sst deploy --stage prod --print-logs

      - name: upload sst logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: sst-logs
          path: |
            .sst/log/
            .sst/pulumi/*/eventlog.json
          if-no-files-found: warn

    env:
      STAGE: prod
      LOG_LEVEL: info
      MONGO_URI: ${{ secrets.MONGO_URI }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
      DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
      DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
