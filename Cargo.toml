[package]
name = "one-million-beers-api"
version = "0.1.0"
edition = "2024"

[profile.release]
debug = 0
incremental = false
panic = "abort"
opt-level = 3       # 0-3
strip = 'symbols'   # strip symbols from binary
lto = true          # enable link time optimization

[dependencies]
axum = "0.8.9"
dotenv = "0.15.0"
lambda_http = "1.3.2"
mongoose = "0.6.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[[bin]]
name = "api"
path = "src/bin/handlers/api.rs"
